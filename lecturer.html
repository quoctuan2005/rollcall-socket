<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer - Phát Âm Cao Tần</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container">
        <div class="panel">
            <h1>📡 PHÁT TỪ (Giảng Viên)</h1>

            <div class="status">
                <div class="status-indicator" id="emitterStatus"></div>
                <span>Trạng thái: <strong id="emitterStatusText">Sẵn sàng</strong></span>
            </div>

            <h2>Cấu Hình Tần Số</h2>
            <div class="frequency-display">
                <div class="freq-item">
                    <label>Tần số cho "0"</label>
                    <div class="control-group">
                        <input type="number" id="freq0" value="18000" min="15000" max="22000" step="100">
                        <div class="freq-value" id="freq0Display">18000 Hz</div>
                    </div>
                </div>
                <div class="freq-item">
                    <label>Tần số cho "1"</label>
                    <div class="control-group">
                        <input type="number" id="freq1" value="20000" min="15000" max="22000" step="100">
                        <div class="freq-value" id="freq1Display">20000 Hz</div>
                    </div>
                </div>
            </div>

            <h2>Cấu Hình Phát</h2>
            <div class="control-group">
                <label for="duration">Độ dài mỗi tín hiệu (ms):</label>
                <input type="range" id="duration" min="500" max="3000" value="500" step="100">
                <div class="slider-value" id="durationDisplay">500 ms</div>
            </div>

            <div class="control-group">
                <label for="amplitude">Âm lượng:</label>
                <input type="range" id="amplitude" min="0.1" max="0.8" value="0.3" step="0.05">
                <div class="slider-value" id="amplitudeDisplay">0.30</div>
            </div>

            <div class="control-group">
                <label for="bitDelay">Delay giữa các bit (ms):</label>
                <input type="range" id="bitDelay" min="0" max="2000" value="0" step="100">
                <div class="slider-value" id="bitDelayDisplay">0 ms</div>
            </div>

            <div class="control-group">
                <label for="bitCount">Số bit cần phát:</label>
                <input type="number" id="bitCount" value="8" min="1" max="100">
            </div>

            <h2>Dữ Liệu Phát</h2>
            <div class="control-group">
                <label for="dataToSend">Nhập bit (0 và 1) hoặc để trống để tự động:</label>
                <input type="text" id="dataToSend" placeholder="ví dụ: 10101010">
            </div>

            <div class="control-group">
                <label>Dữ liệu sẽ phát:</label>
                <div class="display-box empty" id="generatedBits">Chờ tạo dữ liệu...</div>
            </div>

            <div class="button-group full">
                <button class="btn-primary" onclick="generateBits()">🔄 Tạo Dữ Liệu</button>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="startEmitting()" id="emitBtn">▶️ Bắt Đầu Phát</button>
                <button class="btn-danger" onclick="stopEmitting()" id="stopEmitBtn" disabled>⏹️ Dừng</button>
            </div>

            <div class="info-text">
                ℹ️ Máy tính sẽ phát âm thanh cao tần để mã hóa các bit 0 và 1. Hãy để độ âm lớn để điện thoại có thể bắt
                được rõ ràng.
            </div>

            <div class="button-group full">
                <a class="btn-secondary" href="/test.html" style="display:block;text-align:center;line-height:24px;">⬅️
                    Quay lại</a>
            </div>
        </div>
    </div>

    <script src="/static/js/shared.js"></script>
    <script src="/static/js/lecturer.js"></script>
</body>

</html>
